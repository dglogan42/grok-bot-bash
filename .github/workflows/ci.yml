# No secrets. make test does not call the xAI API.

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck, jq, and dpkg-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck jq dpkg-dev

      - name: Lint, test, and build the deb
        run: make lint test deb
